[package]
name = "qhull_rayon"
version = "0.1.0"
edition = "2024"
description = "Three dimensional q-hull algorithm parallelized with rayon."
repository = "https://github.com/Carbonfreezer/qhull_rayon"
license = "MIT"
keywords = ["q-hull", "convex_hull", "geometry"]
readme = "README.md"
authors = ["Christoph Lürig <christoph.luerig@gmail.com>"]
exclude = [
    "test_data/Monkey.png",
    "test_data/out_file.obj",
    "performance_shots/*",
]

[dependencies]
glam = "0.33.3"
rayon = "1.12.0"
fxhash = "0.2.1"
itertools = { version = "0.15.0", optional = true }
rand = { version = "0.10.2", optional = true }

[features]
test-utils = ["dep:itertools", "dep:rand"]

[dev-dependencies]
qhull_rayon = { path = ".", features = ["test-utils"] }
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
tobj = "4.0.5"

[[bench]]
name = "hull_bench"
harness = false

